<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gang Kaibigan Lang Club</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
 
  <style>
    :root {
      --navy: #0d1b3d;
      --blue: #2f6bff;
      --teal: #14c8b4;
      --ink: #14213d;
      --muted: #66728f;
      --line: #dbe2f0;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px 16px;
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
      background-attachment: fixed;
      background:
        radial-gradient(circle at 15% 20%, rgba(47, 107, 255, .55), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(20, 200, 180, .45), transparent 45%),
        linear-gradient(160deg, #0d1b3d 0%, #13295c 100%);
    }
 
 
 
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 34px 30px 30px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(4, 12, 36, .45);
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--blue), var(--teal));
    }
 
 
    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
    }
 
    .sub {
      text-align: center;
      font-size: .88rem;
      color: var(--muted);
      margin: 4px 0 24px;
    }
 
    label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
 
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      font: 400 .95rem 'Poppins', sans-serif;
      color: var(--ink);
      background: #f6f8fd;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input:focus-visible {
      outline: none;
      background: #fff;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(47, 107, 255, .15);
    }
 
    button {
      width: 100%;
      padding: 13px;
      font: 600 1rem 'Poppins', sans-serif;
      color: #fff;
      background: linear-gradient(90deg, var(--blue), #3f86ff);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 107, 255, .35);
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(47, 107, 255, .45); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
 
    #output {
      margin-top: 20px;
      padding: 14px 16px;
      text-align: center;
      font-size: .93rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--navy);
      background: #eef4ff;
      border-left: 4px solid var(--teal);
      border-radius: 8px;
      animation: pop .3s ease;
    }
    #output:empty { display: none; }
 
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
 
    footer {
      position: relative;
      font-size: .78rem;
      color: rgba(255, 255, 255, .7);
    }
 
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
 
<body>
 
  <div class="card">
 
    <h1>Gang Kaibigan Lang Club Checker</h1>
    <p class="sub">Enter your name to see if you made the list.</p>
 
    <label for="first_name">First name</label>
    <input type="text" id="first_name" placeholder="e.g. Simon" autocomplete="off">
 
    <label for="last_name">Last name</label>
    <input type="text" id="last_name" placeholder="e.g. Malimbum" autocomplete="off">
 
    <button type="button" py-click="result_checker">Check my name</button>
 
    <div id="output" role="status" aria-live="polite"></div>
  </div>
 
  <footer>2026 SIMON MALIMBAN; Seatwok 1; 2nd Quarter</footer>
 
  <script type="py" src="./main.py"></script>
</body>
</html>
